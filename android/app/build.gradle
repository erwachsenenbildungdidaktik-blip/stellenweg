plugins { id 'com.android.application' }

// Signatur für Updates: Schlüssel und Passwörter liegen ausserhalb von Git (keystore.properties, tools/)
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ks.load(new FileInputStream(ksFile))

android {
    namespace 'ch.stellenweg.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ch.stellenweg.app'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '2.0'
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}

// Die Web-App aus ../web wird bei jedem Build in die APK kopiert (offline, keine zweite Kopie im Repo)
tasks.register('copyWeb', Copy) {
    dependsOn 'writeVersionJson'
    from("$rootDir/../web") { exclude 'HANDOFF.md', 'README.md', '.claude/**', 'download/**' }
    into("$projectDir/src/main/assets/web")
}
preBuild.dependsOn copyWeb

// Versionsdatei für das Auto-Update: die App vergleicht beim Start ihre versionCode mit web/version.json auf GitHub Pages.
// Text für „Was ist neu“ steht in android/release-notes.txt.
tasks.register('writeVersionJson') {
    def vc = android.defaultConfig.versionCode
    def vn = android.defaultConfig.versionName
    def notesFile = rootProject.file('release-notes.txt')
    def out = file("$rootDir/../web/version.json")
    inputs.property('vc', vc); inputs.property('vn', vn)
    if (notesFile.exists()) inputs.file(notesFile)
    outputs.file(out)
    doLast {
        def notes = notesFile.exists() ? notesFile.getText('UTF-8').trim() : ''
        out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
            [versionCode: vc, versionName: vn, apk: 'download/Stellenweg.apk', notes: notes])) + System.lineSeparator(), 'UTF-8')
    }
}
preBuild.dependsOn writeVersionJson
